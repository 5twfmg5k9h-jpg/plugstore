<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin | PLUGSTORE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f2ed;
  color:#111;
}

header{
  background:#111;
  color:white;
  padding:20px;
}

.header{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:900;
}

.admin-label{
  font-size:10px;
  letter-spacing:2px;
  color:#aaa;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:35px 20px 80px;
}

h1{
  font-size:48px;
  letter-spacing:-3px;
  margin-bottom:10px;
}

.subtitle{
  color:#777;
  font-size:13px;
  margin-bottom:35px;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:40px;
}

.stat{
  background:white;
  border:1px solid #ddd;
  padding:25px;
}

.stat span{
  display:block;
  color:#777;
  font-size:10px;
  letter-spacing:1px;
  margin-bottom:10px;
}

.stat strong{
  font-size:28px;
}

.section{
  background:white;
  border:1px solid #ddd;
  padding:25px;
  margin-bottom:25px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.section-title h2{
  font-size:18px;
}

.add-button{
  border:0;
  background:#111;
  color:white;
  padding:12px 18px;
  cursor:pointer;
  font-size:11px;
}

.products{
  display:grid;
  gap:12px;
}

.product{
  border:1px solid #ddd;
  padding:18px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:20px;
  align-items:center;
}

.product h3{
  font-size:15px;
  margin-bottom:7px;
}

.product p{
  color:#777;
  font-size:12px;
  line-height:1.7;
}

.status{
  display:inline-block;
  margin-top:8px;
  padding:6px 9px;
  font-size:9px;
  font-weight:bold;
  letter-spacing:1px;
}

.available{
  background:#dff5df;
  color:#176b17;
}

.out{
  background:#ffdede;
  color:#b00000;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.actions button{
  padding:9px 12px;
  border:1px solid #111;
  background:white;
  cursor:pointer;
  font-size:10px;
}

.actions .stock{
  background:#111;
  color:white;
}

.actions .delete{
  color:#c00000;
  border-color:#c00000;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  z-index:100;
  padding:20px;
  overflow:auto;
}

.modal-box{
  max-width:600px;
  margin:40px auto;
  background:white;
  padding:30px;
}

.modal-box h2{
  margin-bottom:25px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  font-size:10px;
  font-weight:bold;
  letter-spacing:1px;
  margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  background:white;
  outline:none;
}

.form-group textarea{
  min-height:80px;
  resize:vertical;
}

.form-buttons{
  display:flex;
  gap:10px;
  margin-top:25px;
}

.form-buttons button{
  flex:1;
  padding:14px;
  border:1px solid #111;
  cursor:pointer;
}

.save{
  background:#111;
  color:white;
}

.cancel{
  background:white;
}

.no-products{
  color:#777;
  text-align:center;
  padding:30px;
  font-size:13px;
}

@media(max-width:700px){

  h1{
    font-size:38px;
  }

  .dashboard{
    grid-template-columns:1fr;
  }

  .product{
    grid-template-columns:1fr;
  }

  .actions{
    justify-content:flex-start;
  }

  .section{
    padding:18px;
  }

  .modal-box{
    margin:10px auto;
    padding:22px;
  }
}
</style>
</head>

<body>

<header>

<div class="header">

<div>
<div class="logo">PLUGSTORE</div>
<div class="admin-label">ADMIN PANEL</div>
</div>

<a href="boutique.html" style="color:white;font-size:11px;">
VOIR LA BOUTIQUE →
</a>

</div>

</header>


<main class="container">

<h1>ADMIN</h1>

<p class="subtitle">
Gère tes produits PLUGSTORE depuis un seul endroit.
</p>


<div class="dashboard">

<div class="stat">
<span>PRODUITS</span>
<strong id="totalProducts">0</strong>
</div>

<div class="stat">
<span>DISPONIBLES</span>
<strong id="availableProducts">0</strong>
</div>

<div class="stat">
<span>RUPTURE</span>
<strong id="outProducts">0</strong>
</div>

</div>


<section class="section">

<div class="section-title">

<h2>MES PRODUITS</h2>

<button class="add-button" onclick="openAddProduct()">
+ AJOUTER UN PRODUIT
</button>

</div>


<div class="products" id="products"></div>

</section>

</main>


<!-- MODALE PRODUIT -->

<div class="modal" id="productModal">

<div class="modal-box">

<h2 id="modalTitle">
Ajouter un produit
</h2>


<form id="productForm">

<div class="form-group">

<label>NOM DU PRODUIT</label>

<input
type="text"
id="productName"
placeholder="Ex : Corset noir"
required
>

</div>


<div class="form-group">

<label>PRIX (FCFA)</label>

<input
type="number"
id="productPrice"
placeholder="3500"
min="0"
required
>

</div>


<div class="form-group">

<label>QUANTITÉ</label>

<input
type="number"
id="productQuantity"
placeholder="1"
min="0"
required
>

</div>


<div class="form-group">

<label>DESCRIPTION</label>

<textarea
id="productDescription"
placeholder="Description du produit..."
></textarea>

</div>


<div class="form-group">

<label>STATUT</label>

<select id="productStatus">

<option value="available">
DISPONIBLE
</option>

<option value="out">
RUPTURE DE STOCK
</option>

</select>

</div>


<div class="form-group">

<label>NOM DU FICHIER PHOTO</label>

<input
type="text"
id="productImage"
placeholder="ex : corset-noir.jpg"
>

</div>


<div class="form-buttons">

<button
type="button"
class="cancel"
onclick="closeModal()"
>
ANNULER
</button>

<button
type="submit"
class="save"
>
ENREGISTRER
</button>

</div>

</form>

</div>

</div>


<script>

let products =
JSON.parse(localStorage.getItem("plugstore_products")) || [

{
id:1,
name:"Corset blanc rayé",
price:3500,
quantity:1,
description:"Corset blanc rayé.",
image:"",
status:"available"
},

{
id:2,
name:"Corset Baddies",
price:3500,
quantity:1,
description:"Corset Baddies.",
image:"",
status:"available"
},

{
id:3,
name:"Corset noir rayé",
price:3500,
quantity:1,
description:"Corset noir rayé.",
image:"",
status:"available"
},

{
id:4,
name:"Corset Zara",
price:2500,
quantity:1,
description:"Corset Zara.",
image:"",
status:"available"
},

{
id:5,
name:"Corset fleuri noir",
price:3000,
quantity:1,
description:"Corset fleuri noir.",
image:"",
status:"available"
}

];


let editingId = null;


function saveProducts(){

localStorage.setItem(
"plugstore_products",
JSON.stringify(products)
);

}


function renderProducts(){

const container =
document.getElementById("products");

container.innerHTML = "";


if(products.length === 0){

container.innerHTML =
'<div class="no-products">Aucun produit.</div>';

}else{

products.forEach(product => {

const div =
document.createElement("div");

div.className = "product";


const isOut =
product.status === "out" ||
Number(product.quantity) <= 0;


const statusClass =
isOut ? "out" : "available";

const statusText =
isOut
? "RUPTURE DE STOCK"
: "DISPONIBLE";


div.innerHTML = `

<div>

<h3>${escapeHTML(product.name)}</h3>

<p>
Prix : ${Number(product.price).toLocaleString("fr-FR")} FCFA
<br>
Quantité : ${product.quantity}
<br>
${escapeHTML(product.description || "")}
</p>

<span class="status ${statusClass}">
${statusText}
</span>

</div>


<div class="actions">

<button onclick="editProduct(${product.id})">
MODIFIER
</button>

<button
class="stock"
onclick="toggleStock(${product.id})"
>
${isOut ? "REMETTRE DISPONIBLE" : "METTRE EN RUPTURE"}
</button>

<button
class="delete"
onclick="deleteProduct(${product.id})"
>
SUPPRIMER
</button>

</div>

`;


container.appendChild(div);

});

}


updateStats();

}


function updateStats(){

document.getElementById("totalProducts")
.textContent = products.length;


const available =
products.filter(product =>
product.status !== "out" &&
Number(product.quantity) > 0
).length;


const out =
products.filter(product =>
product.status === "out" ||
Number(product.quantity) <= 0
).length;


document.getElementById("availableProducts")
.textContent = available;


document.getElementById("outProducts")
.textContent = out;

}


function openAddProduct(){

editingId = null;

document.getElementById("modalTitle")
.textContent = "Ajouter un produit";

document.getElementById("productForm").reset();

document.getElementById("productStatus")
.value = "available";

document.getElementById("productModal")
.style.display = "block";

}


function editProduct(id){

const product =
products.find(p => p.id === id);

if(!product) return;

editingId = id;


document.getElementById("modalTitle")
.textContent = "Modifier le produit";


document.getElementById("productName")
.value = product.name;

document.getElementById("productPrice")
.value = product.price;

document.getElementById("productQuantity")
.value = product.quantity;

document.getElementById("productDescription")
.value = product.description || "";

document.getElementById("productStatus")
.value = product.status;

document.getElementById("productImage")
.value = product.image || "";


document.getElementById("productModal")
.style.display = "block";

}


function closeModal(){

document.getElementById("productModal")
.style.display = "none";

}


document
.getElementById("productForm")
.addEventListener("submit",function(event){

event.preventDefault();


const name =
document.getElementById("productName").value.trim();

const price =
Number(document.getElementById("productPrice").value);

const quantity =
Number(document.getElementById("productQuantity").value);

const description =
document.getElementById("productDescription").value.trim();

const status =
document.getElementById("productStatus").value;

const image =
document.getElementById("productImage").value.trim();


if(editingId !== null){

const product =
products.find(p => p.id === editingId);

product.name = name;
product.price = price;
product.quantity = quantity;
product.description = description;
product.status = status;
product.image = image;

}else{

products.push({

id:Date.now(),

name:name,

price:price,

quantity:quantity,

description:description,

image:image,

status:status

});

}


saveProducts();

renderProducts();

closeModal();

});


function toggleStock(id){

const product =
products.find(p => p.id === id);

if(!product) return;


if(product.status === "out"){

product.status = "available";

if(Number(product.quantity) <= 0){

product.quantity = 1;

}

}else{

product.status = "out";

}


saveProducts();

renderProducts();

}


function deleteProduct(id){

const product =
products.find(p => p.id === id);

if(!product) return;


const confirmDelete =
confirm(
"Supprimer " +
product.name +
" ?"
);


if(!confirmDelete) return;


products =
products.filter(p => p.id !== id);


saveProducts();

renderProducts();

}


function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


document
.getElementById("productModal")
.addEventListener("click",function(event){

if(event.target === this){

closeModal();

}

});


renderProducts();

</script>

</body>
</html>
