<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panier | PLUGSTORE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f5f0;
  color:#111;
}

a{
  color:inherit;
  text-decoration:none;
}

header{
  border-bottom:1px solid #ddd;
}

.nav{
  max-width:1400px;
  height:80px;
  margin:auto;
  padding:0 25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:24px;
  font-weight:900;
}

.nav a{
  font-size:12px;
  text-transform:uppercase;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:60px 25px 100px;
}

h1{
  font-size:65px;
  letter-spacing:-4px;
  margin-bottom:40px;
}

.cart{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:50px;
}

.items{
  border-top:1px solid #111;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:25px 0;
  border-bottom:1px solid #ddd;
}

.item-info h3{
  font-size:15px;
  margin-bottom:8px;
}

.item-info p{
  font-size:13px;
  color:#666;
}

.controls{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:15px;
}

.controls button{
  width:30px;
  height:30px;
  border:1px solid #111;
  background:white;
  cursor:pointer;
}

.remove{
  border:0!important;
  background:transparent!important;
  color:#999;
  text-decoration:underline;
  width:auto!important;
}

.item-price{
  font-weight:bold;
  white-space:nowrap;
}

.summary{
  background:#111;
  color:white;
  padding:30px;
  height:max-content;
}

.summary h2{
  font-size:20px;
  margin-bottom:30px;
}

.line{
  display:flex;
  justify-content:space-between;
  margin:15px 0;
  font-size:13px;
  color:#ccc;
}

.total{
  border-top:1px solid #555;
  padding-top:20px;
  margin-top:25px;
  display:flex;
  justify-content:space-between;
  font-size:20px;
  font-weight:bold;
}

.order{
  margin-top:30px;
}

.order input,
.order textarea,
.order select{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border:1px solid #ccc;
  background:white;
  outline:none;
}

.order textarea{
  min-height:90px;
  resize:vertical;
}

.order button{
  width:100%;
  padding:16px;
  border:0;
  background:white;
  color:#111;
  font-weight:bold;
  cursor:pointer;
}

.empty{
  padding:60px 0;
  text-align:center;
  color:#777;
  display:none;
}

footer{
  background:#111;
  color:white;
  padding:50px 25px;
}

.footer{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:30px;
}

.footer h3{
  font-size:22px;
}

.footer h4{
  font-size:10px;
  letter-spacing:2px;
  margin-bottom:12px;
}

.footer p{
  color:#aaa;
  font-size:12px;
  line-height:2;
}

@media(max-width:750px){

  .container{
    padding:45px 18px 80px;
  }

  h1{
    font-size:50px;
  }

  .cart{
    grid-template-columns:1fr;
    gap:30px;
  }

  .nav{
    padding:0 18px;
  }

  .footer{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>

<nav class="nav">

<a href="index.html" class="logo">
PLUGSTORE
</a>

<a href="boutique.html">
← Continuer mes achats
</a>

</nav>

</header>


<main class="container">

<h1>MON PANIER</h1>

<div class="cart">

<section>

<div id="items" class="items"></div>

<div id="empty" class="empty">

Ton panier est vide.

<br><br>

<a href="boutique.html">
Retourner à la boutique →
</a>

</div>

</section>


<aside class="summary">

<h2>RÉCAPITULATIF</h2>

<div class="line">
<span>Sous-total</span>
<span id="subtotal">0 FCFA</span>
</div>

<div class="line">
<span>Livraison</span>
<span>À confirmer</span>
</div>

<div class="total">
<span>TOTAL</span>
<span id="total">0 FCFA</span>
</div>


<form class="order" id="orderForm">

<input
type="text"
id="name"
placeholder="Nom complet"
required
>

<input
type="tel"
id="phone"
placeholder="Numéro WhatsApp"
required
>

<input
type="text"
id="city"
placeholder="Ville / Commune"
required
>

<textarea
id="address"
placeholder="Adresse de livraison"
required
></textarea>

<select id="payment" required>

<option value="">
Mode de paiement
</option>

<option value="Wave">
Wave
</option>

<option value="Orange Money">
Orange Money
</option>

</select>

<button type="submit">
PASSER LA COMMANDE →
</button>

</form>

</aside>

</div>

</main>


<footer>

<div class="footer">

<div>
<h3>PLUGSTORE</h3>
<p>
Curated fashion.<br>
Unique pieces.
</p>
</div>

<div>
<h4>PAIEMENT</h4>
<p>Wave</p>
<p>Orange Money</p>
</div>

<div>
<h4>LIVRAISON</h4>
<p>Abidjan</p>
<p>Côte d'Ivoire</p>
</div>

</div>

</footer>


<script>

let cart =
JSON.parse(localStorage.getItem("plugstore_cart")) || [];

const items =
document.getElementById("items");

const empty =
document.getElementById("empty");

const subtotal =
document.getElementById("subtotal");

const total =
document.getElementById("total");


function money(number){

return number.toLocaleString("fr-FR") + " FCFA";

}


function renderCart(){

items.innerHTML = "";

if(cart.length === 0){

empty.style.display = "block";

subtotal.textContent = money(0);

total.textContent = money(0);

return;

}

empty.style.display = "none";

let sum = 0;


cart.forEach((item,index)=>{

let quantity = item.quantity || 1;

let price = item.price * quantity;

sum += price;


let div =
document.createElement("div");

div.className = "item";

div.innerHTML = `

<div class="item-info">

<h3>${item.name}</h3>

<p>${money(item.price)} / pièce</p>

<div class="controls">

<button onclick="changeQuantity(${index},-1)">
−
</button>

<span>${quantity}</span>

<button onclick="changeQuantity(${index},1)">
+
</button>

<button
class="remove"
onclick="removeItem(${index})">
Supprimer
</button>

</div>

</div>

<div class="item-price">
${money(price)}
</div>

`;

items.appendChild(div);

});


subtotal.textContent = money(sum);

total.textContent = money(sum);

}


function changeQuantity(index,change){

cart[index].quantity =
(cart[index].quantity || 1) + change;

if(cart[index].quantity <= 0){

cart.splice(index,1);

}

saveCart();

}


function removeItem(index){

cart.splice(index,1);

saveCart();

}


function saveCart(){

localStorage.setItem(
"plugstore_cart",
JSON.stringify(cart)
);

renderCart();

}


document
.getElementById("orderForm")
.addEventListener("submit",function(event){

event.preventDefault();

if(cart.length === 0){

alert("Ton panier est vide.");

return;

}


let name =
document.getElementById("name").value;

let phone =
document.getElementById("phone").value;

let city =
document.getElementById("city").value;

let address =
document.getElementById("address").value;

let payment =
document.getElementById("payment").value;


let totalAmount = cart.reduce(
(sum,item)=>
sum + item.price * (item.quantity || 1),
0
);


let products = cart.map(
item =>
`${item.name} x${item.quantity || 1}`
).join("\n");


let message =
`🛍️ NOUVELLE COMMANDE PLUGSTORE

👤 Client : ${name}
📱 WhatsApp : ${phone}
📍 Ville : ${city}
🏠 Adresse : ${address}

🛒 Articles :
${products}

💰 Total : ${money(totalAmount)}

💳 Paiement : ${payment}`;


/* WHATSAPP PLUGSTORE */

let whatsappNumber =
"2250700919603";


let url =
"https://wa.me/" +
whatsappNumber +
"?text=" +
encodeURIComponent(message);


window.open(url,"_blank");

});


renderCart();

</script>

</body>
</html>
